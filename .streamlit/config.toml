[theme]
base = "light"
primaryColor = "#2E86DE"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F7FA"
textColor = "#0E1117"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = true

[server]
maxUploadSize = 5
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[runner]
fastReruns = true
