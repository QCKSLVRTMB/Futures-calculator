[theme]
base = "dark"
primaryColor = "#2E86DE"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#161A25"
textColor = "#FAFAFA"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = true

[server]
maxUploadSize = 5
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[runner]
fastReruns = true
